<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Left Bracket -->
  <path d="M 45 30 L 25 30 L 25 130 L 45 130" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Matrix Grid Dots/Cells -->
  <rect x="42" y="45" width="18" height="18" rx="4" fill="url(#grad1)"/>
  <rect x="72" y="45" width="18" height="18" rx="4" fill="#60A5FA"/>
  <rect x="102" y="45" width="18" height="18" rx="4" fill="#93C5FD"/>

  <rect x="42" y="75" width="18" height="18" rx="4" fill="#3B82F6"/>
  <rect x="72" y="75" width="18" height="18" rx="4" fill="url(#grad2)"/>
  <rect x="102" y="75" width="18" height="18" rx="4" fill="#34D399"/>

  <rect x="42" y="105" width="18" height="18" rx="4" fill="#1D4ED8"/>
  <rect x="72" y="105" width="18" height="18" rx="4" fill="#10B981"/>
  <rect x="102" y="105" width="18" height="18" rx="4" fill="#059669"/>

  <!-- Right Bracket -->
  <path d="M 125 30 L 145 30 L 145 130 L 125 130" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Typography -->
  <text x="175" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#1E293B" letter-spacing="-1">Tiny<tspan fill="url(#grad1)">Matrix</tspan></text>
  <text x="178" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B" letter-spacing="1">ZERO-DEPENDENCY LINEAR ALGEBRA</text>
</svg>
